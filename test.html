<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vis sanity check</title>
  <!-- use CDN so we’re 100 % sure the lib loads -->
  <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <style>#mynetwork{width:100%;height:90vh;border:1px solid #aaa}</style>
</head>
<body>
  <div id="mynetwork"></div>
  <script>
    const nodes=new vis.DataSet([{id:1,label:'Dealer 001'},{id:2,label:'Palisade'}]);
    const edges=new vis.DataSet([{from:1,to:2,label:'STOCK'}]);
    new vis.Network(document.getElementById('mynetwork'),{nodes,edges},{});
  </script>
</body>
</html>
